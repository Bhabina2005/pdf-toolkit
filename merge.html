<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge PDF | PDF Toolkit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-blobs">
        <div class="blob"></div>
        <div class="blob blob-2"></div>
    </div>

    <nav class="nav-pro">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="index.html">
                <i class="fa-solid fa-wand-magic-sparkles brand-icon"></i>
                <span>PDF Toolkit</span>
            </a>
            <div class="d-flex gap-3 align-items-center">
                <button id="themeToggleBtn" class="theme-toggle" onclick="toggleTheme()">
                    <i class="fa-solid fa-sun"></i> Light Mode
                </button>
            </div>
        </div>
    </nav>

    <main class="container my-5 py-md-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card-glass fade-up">
                    <div class="text-center mb-5">
                        <span class="badge rounded-pill mb-2 px-3 py-2" style="background: var(--accent-glow); color: var(--primary);">MERGE TOOL</span>
                        <h1 class="h2 fw-bold mt-2">Merge PDF Files</h1>
                        <p class="text-secondary">Sequence and combine multiple PDFs effortlessly.</p>
                    </div>

                    <!-- Upload Zone -->
                    <div id="dropZone" class="upload-drop-zone mb-4">
                        <input type="file" id="fileInput" multiple accept="application/pdf" class="d-none">
                        <div class="tool-icon mx-auto mb-3">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                        </div>
                        <h3 class="h6 fw-bold">Select PDF Documents</h3>
                        <p class="text-secondary small mb-0">Drag and drop or click to browse</p>
                    </div>

                    <!-- File List -->
                    <div id="fileList" class="mb-4">
                        <!-- Items populated via JS -->
                    </div>

                    <div class="d-grid">
                        <button id="mergeBtn" class="btn-accent py-3 justify-content-center" disabled>
                            <i class="fa-solid fa-link"></i> Merge Documents
                        </button>
                    </div>

                    <div id="statusMessage" class="mt-4 d-none text-center">
                        <div class="alert alert-success bg-success bg-opacity-10 border-success border-opacity-25 text-success rounded-3 p-3">
                            <i class="fa-solid fa-circle-check me-2"></i> Documents merged successfully! Downloading now...
                        </div>
                    </div>
                </div>

                <div class="mt-4 text-center">
                    <a href="index.html" class="text-secondary text-decoration-none small">
                        <i class="fa-solid fa-arrow-left me-2"></i> Back to Tools
                    </a>
                </div>
            </div>
        </div>
    </main>

    <div id="loader" class="loader-overlay">
        <div class="modern-spinner mb-3"></div>
        <p class="fw-bold small opacity-75">PROCESSING YOUR FILES</p>
    </div>

    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="main.js"></script>
    <script src="merge.js"></script>
</body>
</html>
